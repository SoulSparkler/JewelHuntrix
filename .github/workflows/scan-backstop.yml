name: Scan backstop

# Primary scheduled trigger for the Vinted scan, plus a manual dispatch.
#
# WHY THIS EXISTS: on 2026-08-03 the Netlify `scan` cron silently stopped
# firing for ~16 hours. It recorded no failure — scan_state showed
# lastError: null and consecutiveFailures: 0 the entire time, because the
# function was never invoked at all rather than invoked-and-failing. Telegram
# went quiet and nothing surfaced the problem.
#
# HISTORY LESSON (2026-08-06): the `schedule:` below was once removed in
# favor of an external cron service (cron-job.org / UptimeRobot) because
# GitHub's scheduler is best-effort — runs arrived ~23 minutes late and
# whole slots were skipped. But that external cron was never actually
# created, Netlify's own cron had already silently died once, and the result
# was ~48 hours of zero scanning with nothing to notice. A jittery trigger
# that verifiably fires beats a punctual one that doesn't exist. So the
# schedule is back, at */20 so that late/skipped slots still average out to
# roughly the intended 30-minute cadence. If an external cron is ever truly
# set up (see docs/SCRAP_METAL_PATH.md), this can stay on anyway — overlap
# is harmless: scanning is incremental and dedupes against the
# analyzed_listings table, so a doubled run simply works through the backlog
# faster rather than re-analyzing (or re-alerting on) anything.
#
# A failed run here produces a GitHub failure email — that is the alarm bell
# this pipeline was missing.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# Never let two scans run concurrently — each invocation is time-boxed and
# resumes from the DB, so a queued duplicate adds cost without adding coverage.
concurrency:
  group: scan-backstop
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan
        run: |
          set -e
          # Netlify kills functions at ~30s and the scan is time-boxed to
          # SCAN_BUDGET_MS (default 20s), so allow a little headroom past that.
          response=$(curl -s -X POST -o /tmp/body.json -w "%{http_code}" -m 40 \
            https://treasurehuntrix.netlify.app/api/scan)
          cat /tmp/body.json
          echo ""
          echo "HTTP status: $response"

          if [ "$response" -ge 300 ]; then
            echo "::error::scan returned HTTP $response"
            exit 1
          fi

          # The endpoint answers 200 even when individual searches failed —
          # the verdict is in the body, matching the db-health lesson in
          # keep-alive.yml. Without this, a scan erroring on every search
          # would look green here forever.
          if [ "$(jq -r '.ok' /tmp/body.json)" != "true" ]; then
            echo "::error::scan reported failure: $(jq -r '.errors | join(" ~ ")' /tmp/body.json)"
            exit 1
          fi

          checked=$(jq -r '.listingsChecked' /tmp/body.json)
          found=$(jq -r '.newFindings' /tmp/body.json)
          partial=$(jq -r '.partial' /tmp/body.json)
          echo "Analyzed $checked listing(s), $found new finding(s), partial=$partial"

          # `partial: true` is normal and expected — it means the time budget
          # ran out with work remaining, which the next run picks up. It is
          # explicitly NOT a failure condition.
