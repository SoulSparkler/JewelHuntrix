name: Keep Supabase awake

# Independent heartbeat, separate from Netlify's own scheduled functions.
# If Netlify's scheduler silently stops firing (as it did on 2026-08-03), this
# workflow still keeps hitting the DB so the Supabase project doesn't
# auto-pause. Once paused, only a manual dashboard resume (or Supabase Pro)
# brings it back.
#
# Hourly is deliberate. Supabase's free tier only needs "a few requests a day"
# to stay awake, so */20 was ~72 runs/day of pure overkill — and because
# GitHub bills Actions per run rounded UP to a whole minute, that alone came to
# roughly 2,160 min/month against a 2,000-minute allowance. The repo is public
# now (so minutes are free), but there is still no reason to burn 24x the
# needed requests.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit db-health endpoint
        run: |
          set -e
          response=$(curl -s -o /tmp/body.json -w "%{http_code}" -m 20 https://treasurehuntrix.netlify.app/api/db-health)
          cat /tmp/body.json
          echo "HTTP status: $response"
          if [ "$response" -ge 300 ]; then
            echo "::error::db-health returned HTTP $response"
            exit 1
          fi
          # db-health answers 200 even when the DB is unreachable — the verdict
          # is in the body, not the status code. Without this check a dead
          # database (wrong project ref, paused project, bad password) looks
          # green here forever, which is exactly how it went unnoticed before.
          if [ "$(jq -r '.connection' /tmp/body.json)" != "true" ]; then
            echo "::error::DB unreachable: $(jq -r '.tables.error // "unknown"' /tmp/body.json)"
            exit 1
          fi
