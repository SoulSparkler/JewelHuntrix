# Netlify config — true serverless model.
#
# - Frontend (React/Vite) is built from ./client and published from client/dist.
# - Backend logic runs as serverless Functions in ./netlify/functions
#   (scan + health-ping are SCHEDULED functions; their cron is set in-file via
#   `export const config = { schedule }` and can be overridden with env vars).
#
# Required env vars (Netlify UI → Site settings → Environment variables):
#   DATABASE_URL            Postgres POOLED connection string (Supabase pooler / Neon)
#   OPENROUTER_API_KEY      OpenRouter key
#   VISION_MODEL_ID         e.g. openai/gpt-4o      (optional, has default)
#   MESSAGE_MODEL_ID        e.g. openai/gpt-4o-mini (optional, has default)
#   TELEGRAM_BOT_TOKEN      Telegram bot token
#   TELEGRAM_CHAT_ID        Telegram chat id
#   VINTED_BASE_URL         optional, defaults to https://www.vinted.nl
#   VINTED_EXTRA_DOMAINS    optional, e.g. fr,de,be,it,es — extra locale domains
#                           each catalog search also runs against (parallel)
#   VISION_SCORE_THRESHOLD  optional, default 7
#   SCAN_CONCURRENCY        optional, default 5 — listings vision-scored at once;
#                           biggest lever on how much a run gets through
#   PREFILTER_BANNED_WORDS  optional — title-only rejects before any AI call
#   SCAN_CRON / HEALTH_CRON optional cron overrides
#
# Scrap-metal (melt value) path — all optional:
#   METAL_PRICE_PROVIDER    none (default) | manual | http
#   SPOT_PRICE_GOLD_EUR_PER_G / _SILVER_ / _PLATINUM_   used when provider=manual
#   SPOT_PRICE_AS_OF        ISO date the manual prices were read (REQUIRED for manual)
#   MAX_PRICE_AGE_HOURS     optional, default 24 — older prices are marked stale
#   SCRAP_ALERT_MODE        underpriced_only (default) | all_hallmarks | off
#   UNMARKED_ALERT_MODE     medium_and_high (default) | high_only | off
#   ASSUMED_SHIPPING_EUR    optional, default 3.5 (caps already include shipping)
# With no provider configured the scrap path still reports hallmarks — it just
# omits the euro figure rather than guessing one.

[build]
  command = "npm install && cd client && npm install && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**", "shared/**", "docs/*.json"]

# Route all /api/* calls to the serverless Express wrapper.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: serve the built index.html for any client-side route
# (/searches, /findings, /manual-scan, …) so a hard refresh / deep link
# doesn't 404. Must come AFTER the /api/* rule above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
